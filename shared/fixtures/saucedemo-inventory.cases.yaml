cases:
  - name: standard_user库存页可见并可加购
    username: standard_user
    password: secret_sauce
    expectType: success
    expectedUrlIncludes: /inventory.html
    expectedTitle: Products
    expectedItemCountMin: 1
    sortValue: az
    addItemName: Sauce Labs Backpack
    expectedCartBadge: "1"

  - name: locked_out_user无法进入库存页
    username: locked_out_user
    password: secret_sauce
    expectType: error
    expectedErrorIncludes: Sorry, this user has been locked out.

